quarkus.rest-client.follow-redirects=true

# We are doing this so that we can run the jar file directly using `jbang org.mcp-server:kruize_mcp_server:1.0-SNAPSHOT:runner`
quarkus.package.jar.type=uber-jar

# Enable logging to a file
quarkus.log.file.enable=true
quarkus.log.file.path=kruize-mcp-server.log
org.mcp_server.KruizeApiClient/mp-rest/url=${KRUIZE_URL:http://localhost:8080}